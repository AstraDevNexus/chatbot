<!DOCTYPE html>
<html>
<head>
  <title>Astra Nexus Chat</title>
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body class="chat-page">

  <button class="new-chat">＋ New Chat</button>
  <div id="chatList"></div>

  </div>
</div>

<script src="/static/js/app.js"></script>
<script src="/static/js/theme.js"></script>
</body>
</html>
