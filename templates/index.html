<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Astra Nexus</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/static/css/main.css" />
</head>

<body>
  <canvas id="particles"></canvas>

  <div class="chat-body">
    <aside class="sidebar">
      <h2>Astra Nexus</h2>
      <button id="newChatBtn">+ New Chat</button>
      <div id="chatList"></div>
      <button id="logoutBtn">Logout</button>
    </aside>

    <section class="chat">
      <div id="messages"></div>
      <div class="input-box">
        <input id="prompt" placeholder="Message Astra AI…" />
        <button id="sendBtn">▶</button>
      </div>
    </section>
  </div>

  <!-- ONLY ONE SCRIPT -->
  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
