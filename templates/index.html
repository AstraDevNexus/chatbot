<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AstraDev Nexus</title>
<script src="/static/marked.min.js"></script>
<style>
body{
  margin:0;
  background:#020617;
  color:#e5e7eb;
  font-family:Inter;
  display:flex;
  height:100vh;
}
.chat{
  flex:1;
  display:flex;
  flex-direction:column;
}
#messages{
  flex:1;
  overflow:auto;
  padding:20px;
}
.msg{margin-bottom:16px}
.user{color:#22d3ee}
.bot{background:#0f172a;padding:14px;border-radius:12px}
.input{
  display:flex;
  padding:12px;
  border-top:1px solid #1e293b;
}
input{
  flex:1;
  padding:12px;
  background:#020617;
  color:#fff;
  border:none;
  border-radius:10px;
}
button{
  margin-left:8px;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#22d3ee;
}
pre{background:#020617;padding:12px;border-radius:10px}
@media(max-width:600px){
  #messages{padding:12px}
}
</style>
</head>
<body>

<div class="chat">
  <div id="messages">
    <div class="bot">Namaste! Ask anything 🚀</div>
  </div>

  <div class="input">
    <input id="text" placeholder="Type and press Enter">
    <button onclick="send()">Send</button>
  </div>
</div>

<script>
const box = document.getElementById("messages");
const input = document.getElementById("text");

function typeText(el, text){
  let i=0;
  const t = setInterval(()=>{
    el.innerHTML = marked.parse(text.slice(0,i++));
    box.scrollTop = box.scrollHeight;
    if(i>text.length) clearInterval(t);
  }, 12);
}

async function send(){
  const msg = input.value.trim();
  if(!msg) return;
  input.value="";

  box.innerHTML += `<div class="msg user">${msg}</div>`;
  const bot = document.createElement("div");
  bot.className="msg bot";
  box.appendChild(bot);

  const r = await fetch("/api/chat",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({message:msg})
  });

  const data = await r.json();
  typeText(bot, data.reply);
}

input.addEventListener("keydown",e=>{
  if(e.key==="Enter") send();
});
</script>

</body>
</html>
