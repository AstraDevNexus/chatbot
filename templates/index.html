<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AstraDev Nexus AI</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="/static/marked.min.js"></script>

<!-- Firebase v8 (CRITICAL FIX) -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<style>
body{margin:0;font-family:Inter;background:#020617;color:#e5e7eb}
.hidden{display:none}
.sidebar{width:260px;background:#020617;height:100vh;position:fixed}
.mobile-toggle{display:none}
@media(max-width:768px){
  .sidebar{transform:translateX(-100%);transition:.3s}
  .sidebar.open{transform:translateX(0)}
  .mobile-toggle{display:block;padding:12px}
}
.chat{margin-left:260px;padding:20px}
@media(max-width:768px){.chat{margin-left:0}}
.msg{padding:14px;border-radius:12px;margin-bottom:12px}
.user{background:#4c1d95;margin-left:auto}
.bot{background:#111827}
</style>
</head>

<body>

<button class="mobile-toggle" onclick="toggleSidebar()">☰</button>

<div class="sidebar" id="sidebar">
  <h3>Chats</h3>
  <div id="chatList"></div>
  <button onclick="logout()">Logout</button>
</div>

<div class="chat">
  <div id="messages"></div>
  <input id="input" placeholder="Ask something..." onkeydown="if(event.key==='Enter')send()">
</div>

<script>
/* FIREBASE CONFIG (SAFE) */
firebase.initializeApp({
  apiKey: "YOUR_FIREBASE_KEY",
  authDomain: "YOUR_DOMAIN",
  projectId: "YOUR_PROJECT_ID"
});

const auth = firebase.auth();
const db = firebase.firestore();
let uid = null;

/* AUTH */
auth.onAuthStateChanged(user=>{
  if(!user){
    auth.signInAnonymously();
  } else {
    uid = user.uid;
    loadHistory();
  }
});

/* CHAT */
async function send(){
  const text = input.value;
  input.value = "";
  add(text,"user");

  await db.collection("chats").add({uid,text,role:"user",t:Date.now()});

  const r = await fetch("/api/chat",{
    method:"POST",
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({message:text})
  });

  const data = await r.json();
  type(data.reply);
  await db.collection("chats").add({uid,text:data.reply,role:"bot",t:Date.now()});
}

function add(text,cls){
  const d=document.createElement("div");
  d.className="msg "+cls;
  d.innerHTML=marked.parse(text);
  messages.appendChild(d);
}

function type(text){
  let i=0;
  const d=document.createElement("div");
  d.className="msg bot";
  messages.appendChild(d);
  const t=setInterval(()=>{
    d.innerHTML=marked.parse(text.slice(0,i++));
    if(i>text.length)clearInterval(t);
  },20);
}

/* HISTORY */
function loadHistory(){
  db.collection("chats").where("uid","==",uid).orderBy("t")
  .onSnapshot(s=>{
    messages.innerHTML="";
    s.forEach(d=>add(d.data().text,d.data().role));
  });
}

/* UI */
function toggleSidebar(){
  sidebar.classList.toggle("open");
}
function logout(){
  auth.signOut();
}
</script>
</body>
</html>
