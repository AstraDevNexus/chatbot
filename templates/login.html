<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Astra Nexus — Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Main shared styles -->
  <link rel="stylesheet" href="/static/css/main.css" />

  <!-- Firebase COMPAT (no ES modules) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>

<body class="login-body">

  <!-- Ambient glow background -->
  <div class="login-bg"></div>

  <!-- Login Card -->
  <div class="login-card">

    <h1 class="login-logo">
      Astra<span>Nexus</span>
    </h1>

    <p class="login-subtitle">
      Sign in to continue
    </p>

    <!-- Email -->
    <input
      id="email"
      type="email"
      placeholder="Email address"
      autocomplete="email"
    />

    <!-- Password -->
    <input
      id="password"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    />

    <!-- Buttons -->
    <button class="btn primary" onclick="emailLogin()">
      Login
    </button>

    <button class="btn ghost" onclick="emailSignup()">
      Create Account
    </button>

    <div class="divider">
      <span>OR</span>
    </div>

    <button class="btn google" onclick="googleLogin()">
      Continue with Google
    </button>

    <p id="authError" class="auth-error"></p>

  </div>

  <!-- Firebase Init + Auth Logic -->
  <script>
    // 🔥 Firebase config (REPLACE WITH YOUR REAL VALUES)
    const firebaseConfig = {
      apiKey: "AIzaSyDMgUlLMjrMDXCXJTdUpGdqRfB1U_kQpqU",
      authDomain: "ai-login-4a340.firebaseapp.com",
      projectId: "ai-login-4a340"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // 🧠 Remember last email
    const savedEmail = localStorage.getItem("lastEmail");
    if (savedEmail) {
      document.getElementById("email").value = savedEmail;
    }

    // ✉️ Email Login
    function emailLogin() {
      const email = emailInput();
      const password = passwordInput();

      auth.signInWithEmailAndPassword(email, password)
        .then(() => {
          localStorage.setItem("lastEmail", email);
          window.location.replace("/");
        })
        .catch(err => showError(err.message));
    }

    // 🆕 Email Signup
    function emailSignup() {
      const email = emailInput();
      const password = passwordInput();

      auth.createUserWithEmailAndPassword(email, password)
        .then(() => {
          localStorage.setItem("lastEmail", email);
          window.location.replace("/");
        })
        .catch(err => showError(err.message));
    }

    // 🌐 Google Login
    function googleLogin() {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider)
        .then(() => window.location.replace("/"))
        .catch(err => showError(err.message));
    }

    // 🔁 Auto redirect if already logged in
    auth.onAuthStateChanged(user => {
      if (user) {
        window.location.replace("/");
      }
    });

    function emailInput() {
      return document.getElementById("email").value.trim();
    }

    function passwordInput() {
      return document.getElementById("password").value.trim();
    }

    function showError(msg) {
      document.getElementById("authError").innerText = msg;
    }
  </script>

</body>
</html>
